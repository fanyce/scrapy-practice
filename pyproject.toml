[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapy-practice"
version = "0.1.0"
description = "A practice project for learning Scrapy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Scrapy==2.19.0",
]

[tool.setuptools.packages.find]
include = ["scrapy_practice*"]

